<!DOCTYPE html>

<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --violet: #7B61FF;
      --violet-light: #9E8FFF;
      --violet-dark: #5340C9;
      --coral: #FF7A5A;
      --coral-dark: #CC4A28;
      --green: #2D9E75;
      --night: #1A1A2E;
      --night2: #12122A;
      --night3: #22224A;
      --night4: #2A2A40;
      --border: #2E2E4A;
      --border2: #3E3E5E;
      --muted: #8888AA;
      --dim: #55557A;
      --white: #ffffff;
      --font-head: 'Plus Jakarta Sans', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--night);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background-image: radial-gradient(circle at 50% 0%, rgba(123,97,255,0.12), transparent 60%);
    }

    h1, h2, h3, h4 { font-family: var(--font-head); }
    a { text-decoration: none; color: inherit; }

    .wrap {
      max-width: 480px;
      text-align: center;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 2.5rem;
    }
    .logo-mark {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      width: 22px;
      height: 22px;
    }
    .logo-mark span { border-radius: 3px; background: var(--violet); }
    .logo-mark span:nth-child(2), .logo-mark span:nth-child(3) { opacity: 0.5; }
    .logo-mark span:nth-child(4) { opacity: 0.25; }
    .logo-text {
      font-family: var(--font-head);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;
    }

    .code {
      font-family: var(--font-head);
      font-size: 96px;
      font-weight: 800;
      letter-spacing: -2px;
      background: linear-gradient(135deg, var(--violet-light), var(--coral));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-top: 1rem;
    }

    p {
      color: var(--muted);
      margin-top: 0.75rem;
      font-size: 15px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary {
      background: var(--violet);
      color: var(--white);
    }
    .btn-secondary {
      background: var(--night3);
      color: var(--white);
      border: 1px solid var(--border2);
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(123,97,255,0.25);
    }
  </style>
  <!-- Google tag (gtag.js) — carga sujeta al aviso de cookies -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('consent', 'default', { analytics_storage: 'denied' });

    function kitifyLoadGA4() {
      if (window.kitifyGA4Loaded) return;
      window.kitifyGA4Loaded = true;
      var s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-0J2CC9FWT1';
      document.head.appendChild(s);
      gtag('consent', 'update', { analytics_storage: 'granted' });
      gtag('config', 'G-0J2CC9FWT1');
    }

    if (localStorage.getItem('kitify_cookie_consent') === 'accepted') {
      kitifyLoadGA4();
    }
  </script>
</head>
<body>

  <div class="wrap fade-in">
    <a href="/" class="logo">
      <div class="logo-mark"><span></span><span></span><span></span><span></span></div>
      <span class="logo-text">Kitify</span>
    </a>

    <div class="code">404</div>
    <h1>Esta pieza no encajó</h1>
    <p>La página que buscas no existe o fue movida. Vuelve al inicio y sigue armando tu estrategia de marketing.</p>

    <div class="actions">
      <a href="/" class="btn btn-primary">Ir al inicio</a>
      <a href="/#herramientas" class="btn btn-secondary">Explorar herramientas gratis</a>
    </div>
  </div>


  <!-- COOKIE BANNER -->
  <style>
    #kitify-cookie-banner{position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;background:#1A1A2E;border:1px solid #2E2E4A;border-radius:16px;padding:1.1rem 1.25rem;box-shadow:0 12px 32px rgba(0,0,0,.35);display:none;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;font-family:'DM Sans',sans-serif;}
    #kitify-cookie-banner p{margin:0;font-size:13px;line-height:1.5;color:#D8D8EE;max-width:520px;}
    #kitify-cookie-banner a{color:#9E8FFF;text-decoration:underline;}
    .kitify-cookie-actions{display:flex;gap:8px;flex-shrink:0;}
    .kitify-cookie-btn{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:9px 16px;border-radius:10px;cursor:pointer;border:none;}
    .kitify-cookie-btn-accept{background:#7B61FF;color:#fff;}
    .kitify-cookie-btn-reject{background:transparent;color:#8888AA;border:1px solid #3E3E5E;}
    @media (max-width:600px){#kitify-cookie-banner{flex-direction:column;align-items:stretch;}.kitify-cookie-actions{width:100%;}.kitify-cookie-btn{flex:1;}}
  </style>
  <div id="kitify-cookie-banner">
    <p>Usamos cookies propias y de Google Analytics para entender cómo usas el sitio y mejorarlo. <a href="privacidad.html">Más información</a>.</p>
    <div class="kitify-cookie-actions">
      <button id="kitify-cookie-reject" class="kitify-cookie-btn kitify-cookie-btn-reject">Rechazar</button>
      <button id="kitify-cookie-accept" class="kitify-cookie-btn kitify-cookie-btn-accept">Aceptar</button>
    </div>
  </div>
  <script>
    (function(){
      var consent = localStorage.getItem('kitify_cookie_consent');
      var banner = document.getElementById('kitify-cookie-banner');
      if (!consent && banner) { banner.style.display = 'flex'; }
      var acceptBtn = document.getElementById('kitify-cookie-accept');
      var rejectBtn = document.getElementById('kitify-cookie-reject');
      if (acceptBtn) acceptBtn.addEventListener('click', function(){
        localStorage.setItem('kitify_cookie_consent', 'accepted');
        banner.style.display = 'none';
        if (typeof kitifyLoadGA4 === 'function') kitifyLoadGA4();
      });
      if (rejectBtn) rejectBtn.addEventListener('click', function(){
        localStorage.setItem('kitify_cookie_consent', 'rejected');
        banner.style.display = 'none';
      });
    })();
  </script>
