    html { scroll-behavior: smooth; }

    body {

      gap: 9px;
      margin-bottom: 2.5rem;
    }
    .logo-mark {
      display: grid;
      grid-template-columns: 1fr 1fr;

      width: 22px;
      height: 22px;

    .logo-mark span { border-radius: 3px; background: var(--violet); }

    .logo-mark span:nth-child(4) { opacity: 0.25; }
    .logo-text {

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-top: 1rem;
    }

    p {
      color: var(--muted);
      margin-top: 0.75rem;
      font-size: 15px;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 2.5rem;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.85rem 1.5rem;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary {
      background: var(--violet);
      color: var(--white);
    }
    .btn-secondary {
      background: var(--night3);
      color: var(--white);
      border: 1px solid var(--border2);
    }
    .btn:hover {
      transform: translateY(-3px);
